# Banco LOCAL de desenvolvimento. Não use estas credenciais em produção.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: unha
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: unha
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - unha_postgres:/var/lib/postgresql/data
volumes:
  unha_postgres:
