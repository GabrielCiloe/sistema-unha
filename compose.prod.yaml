# Produção no Coolify (recurso "Docker Compose"). Variáveis são definidas na UI do Coolify.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://unha:${POSTGRES_PASSWORD}@db:5432/unha
      DIRECT_URL: postgresql://unha:${POSTGRES_PASSWORD}@db:5432/unha
      APP_ORIGIN: ${APP_ORIGIN}
      CRON_SECRET: ${CRON_SECRET}
      WA_AKG_URL: ${WA_AKG_URL}
      WA_AKG_API_KEY: ${WA_AKG_API_KEY}
      WA_WEBHOOK_SECRET: ${WA_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: unha
    volumes:
      - unha_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unha"]
      interval: 5s
      retries: 10
volumes:
  unha_postgres:
