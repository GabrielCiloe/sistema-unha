# Rede LOCAL: app + Postgres + WA-AKG (WhatsApp) + MySQL, tudo em um comando.
#   docker compose -f compose.local.yaml up -d --build
# Acesso na rede: http://<LAN_IP>:3000 (agenda) e http://<LAN_IP>:3001 (painel WA-AKG).
# Variáveis vêm do arquivo .env na raiz (LAN_IP, APP_ORIGIN, WA_AKG_API_KEY, senhas...).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unha
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: unha
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - unha_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unha"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"            # 0.0.0.0 -> acessível pela rede local
    environment:
      DATABASE_URL: postgresql://unha:local-development-only@db:5432/unha
      DIRECT_URL: postgresql://unha:local-development-only@db:5432/unha
      APP_ORIGIN: ${APP_ORIGIN}
      CRON_SECRET: ${CRON_SECRET}
      WA_AKG_URL: ${WA_AKG_URL}
      WA_AKG_API_KEY: ${WA_AKG_API_KEY}
      WA_WEBHOOK_SECRET: ${WA_WEBHOOK_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
      wa-akg:
        condition: service_started

  # Lembretes/expiração de reservas: chama /api/cron/reminders a cada 15 min (substitui o Vercel Cron).
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: >
      sh -c 'while true; do sleep 900;
      curl -s -o /dev/null -w "cron %{http_code}\n" -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/reminders;
      done'
    depends_on:
      - app

  wa-akg-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${WA_AKG_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wa_akg
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - wa_akg_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${WA_AKG_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  wa-akg:
    build: ./vendor/wa-akg
    restart: unless-stopped
    ports:
      - "3001:3000"            # painel e API do WA-AKG na rede local
    environment:
      DATABASE_URL: mysql://root:${WA_AKG_MYSQL_ROOT_PASSWORD}@wa-akg-db:3306/wa_akg
      AUTH_SECRET: ${WA_AKG_AUTH_SECRET}
      BASE_URL: ${WA_AKG_PUBLIC_URL}
      NEXTAUTH_URL: ${WA_AKG_PUBLIC_URL}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: ${WA_AKG_PUBLIC_URL}
      NEXT_PUBLIC_API_URL: ${WA_AKG_PUBLIC_URL}/api
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BAILEYS_LOG_LEVEL: error
      NEXT_PUBLIC_SWAGGER_ENABLED: "true"
      TZ: America/Sao_Paulo
      LOCALE: pt-BR
      DEFAULT_LANGUAGE: pt-BR
      ENABLE_TELEMETRY: "false"
      ADMIN_EMAIL: ${WA_AKG_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${WA_AKG_ADMIN_PASSWORD}
    depends_on:
      wa-akg-db:
        condition: service_healthy
    volumes:
      - wa_akg_data:/app/data
      - wa_akg_uploads:/app/uploads

volumes:
  unha_postgres:
  wa_akg_mysql:
  wa_akg_data:
  wa_akg_uploads:
