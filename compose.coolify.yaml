# Deploy no Coolify (recurso "Docker Compose" apontando para este repositório, arquivo /compose.coolify.yaml).
# Sobe o mesmo conjunto que roda localmente: app + Postgres + cron + WA-AKG (WhatsApp) + MySQL.
#
# Variáveis definidas na aba "Environment Variables" do recurso (ver docs/DEPLOY-COOLIFY.md):
#   APP_ORIGIN            domínio do serviço "app", exatamente como está no Coolify (ex.: https://agenda.1-2-3-4.sslip.io)
#   WA_AKG_PUBLIC_URL     domínio do serviço "waakg" (painel do WhatsApp), ex.: https://wa.1-2-3-4.sslip.io
#   WA_AKG_API_KEY        chave wag_... gerada no painel do WA-AKG (Settings > API Keys) depois do 1º deploy
#   SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD   primeiro administrador do app (senha com 12+ caracteres)
#   WA_AKG_ADMIN_EMAIL / WA_AKG_ADMIN_PASSWORD   login do painel do WA-AKG
#   RESEND_API_KEY / EMAIL_FROM   opcionais: envio do link de "Esqueci minha senha" por e-mail (Resend)
# Senhas internas (bancos, segredos) são geradas pelo próprio Coolify (variáveis SERVICE_PASSWORD_* / SERVICE_BASE64_*).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://unha:${SERVICE_PASSWORD_POSTGRES}@db:5432/unha
      DIRECT_URL: postgresql://unha:${SERVICE_PASSWORD_POSTGRES}@db:5432/unha
      APP_ORIGIN: ${APP_ORIGIN}
      CRON_SECRET: ${SERVICE_PASSWORD_64_CRON}
      WA_AKG_URL: http://waakg:3000
      WA_AKG_API_KEY: ${WA_AKG_API_KEY:-}
      WA_WEBHOOK_SECRET: ${SERVICE_PASSWORD_64_WEBHOOK}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TZ: America/Sao_Paulo
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unha
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: unha
    volumes:
      - unha_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unha"]
      interval: 5s
      retries: 10

  # Lembretes, expiração de reservas sem sinal e convites de retorno: chama o app a cada 15 min.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${SERVICE_PASSWORD_64_CRON}
    command: >
      sh -c 'while true; do sleep 900;
      curl -s -o /dev/null -w "cron %{http_code}\n" -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/reminders;
      done'
    depends_on:
      - app

  # WhatsApp (WA-AKG v1.7.0), construído direto do repositório oficial na versão testada.
  waakg:
    build:
      context: https://github.com/mrifqidaffaaditya/WA-AKG.git#04d6c0f5e484df469840697e3573654691792958
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:${SERVICE_PASSWORD_MYSQL}@waakgdb:3306/wa_akg
      AUTH_SECRET: ${SERVICE_BASE64_64_AUTH}
      BASE_URL: ${WA_AKG_PUBLIC_URL}
      NEXTAUTH_URL: ${WA_AKG_PUBLIC_URL}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: ${WA_AKG_PUBLIC_URL}
      NEXT_PUBLIC_API_URL: ${WA_AKG_PUBLIC_URL}/api
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BAILEYS_LOG_LEVEL: error
      TZ: America/Sao_Paulo
      LOCALE: pt-BR
      DEFAULT_LANGUAGE: pt-BR
      ENABLE_TELEMETRY: "false"
      ADMIN_EMAIL: ${WA_AKG_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${WA_AKG_ADMIN_PASSWORD:-}
    expose:
      - "3000"
    volumes:
      - wa_akg_data:/app/data
      - wa_akg_uploads:/app/uploads
    depends_on:
      waakgdb:
        condition: service_healthy

  waakgdb:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
      MYSQL_DATABASE: wa_akg
    volumes:
      - wa_akg_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  unha_postgres:
  wa_akg_mysql:
  wa_akg_data:
  wa_akg_uploads:
